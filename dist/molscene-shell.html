<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>molscene</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #070a10; font-family: system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #panel { position: fixed; top: 12px; left: 12px; max-width: 340px; color: #e8ecf3; }
  #panel h1 { font-size: 15px; margin: 0 0 4px; }
  #description { font-size: 12.5px; line-height: 1.4; color: #b7c0d4; margin: 0 0 10px; white-space: pre-wrap; }
  #modes button, #controls button { font: inherit; font-size: 12px; background: #141b2b; color: #e8ecf3; border: 1px solid #2a3550; border-radius: 6px; padding: 5px 10px; margin: 0 6px 6px 0; cursor: pointer; }
  #modes button.active { background: #2f6fed; border-color: #2f6fed; }
  #legend { font-size: 11.5px; margin-top: 8px; }
  #legend .row { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
  #legend .sw { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #err { display: none; position: fixed; bottom: 12px; left: 12px; right: 12px; background: #401515; color: #ffb4b4; font-size: 12px; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; }
  #reaction { display: none; margin-top: 8px; }
  #reaction input { width: 100%; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="panel">
  <h1 id="name">molscene</h1>
  <p id="description" style="display:none;"></p>
  <div id="modes">
    <button data-mode="cloud" class="active">Nube</button>
    <button data-mode="atmosphere">Atmósfera</button>
    <button data-mode="ballstick">Bola-palito</button>
  </div>
  <div id="controls">
    <button id="playBtn">Pausar</button>
    <button id="resetBtn">Reiniciar cámara</button>
  </div>
  <div id="reaction">
    <button id="playReactionBtn">▶ Reproducir reacción</button>
    <input id="reactionSlider" type="range" min="0" max="1" step="0.01" value="0">
  </div>
  <div id="legend"></div>
</div>
<div id="err"></div>
<script src="molscene-shell.js"></script>
</body>
</html>
